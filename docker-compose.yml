services:
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      PORT: "3000"
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost}

  web:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config: